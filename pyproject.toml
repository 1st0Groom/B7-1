[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "b7-chat"
version = "0.1.0"
description = "FastAPI learning chatbot with an OpenAI-compatible API and SQLite"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<3", "aiosqlite>=0.21,<1",
  "pydantic-settings>=2.8,<3",
  "openai>=2,<3",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
