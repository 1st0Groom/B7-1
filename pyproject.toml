[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "b7-chat"
version = "0.1.0"
description = "FastAPI learning chatbot with OpenAI and SQLite"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<3", "aiosqlite>=0.21,<1", "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3", "argon2-cffi>=23.1,<26",
  "openai>=2,<3", "tiktoken>=0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.11,<1"]

browser = ["playwright>=1.50,<2"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
