name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global pnpm@12.3.4
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend check
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
      - run: uv sync --frozen --python 3.12 --extra dev --extra browser
      - run: uv run --frozen ruff check app tests migrations scripts
      - run: uv run --frozen ruff format --check app tests migrations scripts
      - run: uv run --frozen pytest -q
      - run: uv run --frozen playwright install --with-deps chromium
      - run: uv run --frozen python -m tests.browser_smoke
      - run: docker build -t b7-chat:ci .
